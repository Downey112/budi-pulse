name: BudiPulse ETL Pipeline

on:
  schedule:
    # Runs at 00:00 UTC (8:00 AM Malaysia Time) every Wednesday
    - cron: '0 0 * * 3'
  workflow_dispatch: # Allows you to click a "Run workflow" button manually

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Pipeline (Ingest & Upsert)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python src/db.py